name: Flama Auto Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-auto-merge.yml@34337804b379ae4342efc6e38890dad8268eaa73
    with:
      profile: fast
      release-branch: main
    # Exactly the optional App credential pair is forwarded, by name. The App
    # identity makes the eventual merge push start push workflows, which the
    # default token's github-actions[bot] merge never does. Where the secrets
    # do not exist the values arrive empty and the platform workflow falls
    # back to the default token. Blanket inheritance stays forbidden.
    secrets:
      WORKFLOW_APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
      WORKFLOW_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
