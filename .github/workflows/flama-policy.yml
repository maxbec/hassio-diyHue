name: Flama Policy

on:
  pull_request:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@34337804b379ae4342efc6e38890dad8268eaa73
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-maxbec
      platform-sha: 3915526f99c19231cbb08a43ce54e4a9f8f3a012
      profile: fast
