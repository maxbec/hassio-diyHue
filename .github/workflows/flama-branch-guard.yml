name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@a34f976e94c462dcbde5dc6c75c913b324643ef8
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
