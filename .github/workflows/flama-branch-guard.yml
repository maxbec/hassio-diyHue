name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@592a44ef454dcc2d5446dd937db6c0f6b24089ec
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
