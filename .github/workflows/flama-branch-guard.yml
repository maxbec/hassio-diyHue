name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@34337804b379ae4342efc6e38890dad8268eaa73
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
