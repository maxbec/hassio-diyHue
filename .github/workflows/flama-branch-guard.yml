name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@a3aae0cde3aabefea29c7cf3576cf2331d487e1b
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
