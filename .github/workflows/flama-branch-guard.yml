name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@3915526f99c19231cbb08a43ce54e4a9f8f3a012
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
